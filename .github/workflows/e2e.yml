name: E2E

# Playwright production-build journeys (QA-7 / CICD-3). The broad suite runs
# under real headless Chromium with deterministic API interception, while the
# dedicated auth smoke exercises a real Go API, Postgres, and Redis through the
# same-origin BFF.

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright — production build journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ system deps)
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      # The Playwright config's webServer builds (pnpm build) and starts
      # (next start) the app, then the specs drive it. CI=true is set by GitHub
      # Actions, which flips the config to the CI reporter and disables server
      # reuse.
      - name: Run e2e specs
        run: pnpm -C apps/web exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  fullstack-e2e:
    name: Playwright — real API auth smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fuelgrid
          POSTGRES_PASSWORD: fuelgrid
          POSTGRES_DB: fuelgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuelgrid -d fuelgrid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fuelgrid:fuelgrid@127.0.0.1:5432/fuelgrid?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_PASSWORD_PEPPER: e2e-test-pepper
      AUTH_ENFORCE_MFA_FOR_PRIVILEGED_ROLES: 'false'
      DEMO_USER_PASSWORD: e2e-real-stack-user-password-2026
      DEMO_ADMIN_PASSWORD: e2e-real-stack-admin-password-2026
      FULLSTACK_E2E: '1'
      API_ORIGIN: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed test database
        run: |
          go run ./services/api/cmd/migrate up
          go run ./services/api/cmd/seed

      - name: Build and start API
        run: |
          go build -o /tmp/fuelgrid-api ./services/api/cmd/api
          nohup /tmp/fuelgrid-api >/tmp/fuelgrid-api.log 2>&1 &
          echo $! > /tmp/fuelgrid-api.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/fuelgrid-api.log
          exit 1

      - name: Install Playwright Chromium (+ system deps)
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run real-stack browser smoke
        run: pnpm -C apps/web exec playwright test e2e/fullstack-auth.spec.ts

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-e2e-diagnostics
          path: |
            apps/web/playwright-report/
            /tmp/fuelgrid-api.log
          retention-days: 7
