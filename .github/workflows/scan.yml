name: Security Scan

# Supply-chain & vulnerability scanning. Standalone from ci.yml so the
# security surface (Trivy fs + image scans, SBOM) evolves independently of
# the build/test pipeline and reports into GitHub code-scanning.
#
# Trivy runs from its official GHCR image (ghcr.io/aquasecurity/trivy) via
# plain `docker run` rather than aquasecurity/trivy-action. The action's
# binary-bootstrap path (it sparse-checks-out trivy's contrib dir and runs
# install.sh to download the release binary, and pulls a separately-tagged
# setup-trivy) proved brittle — a removed setup-trivy tag and a failing
# install.sh both broke "Set up job"/install. Pinning the container image is
# hermetic and has no such moving parts.
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch — newly disclosed CVEs land against already-merged code,
    # so re-scan main every Monday 06:00 UTC even with no new commits.
    - cron: '0 6 * * 1'

# Least privilege: read the repo, write SARIF to the security tab. Nothing else.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin the Trivy version (image tag == CLI version) so scans are reproducible.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0

jobs:
  filesystem:
    name: Trivy — filesystem (vuln + misconfig + secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Full-visibility pass: every severity, SARIF only. This is what shows
      # up in the Security tab; exit-code 0 so the code-scanning record is
      # always complete regardless of findings.
      - name: Trivy filesystem scan (SARIF report)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,misconfig,secret \
              --format sarif --output trivy-fs.sarif \
              --no-progress --exit-code 0 .

      - name: Upload filesystem SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        # Always upload, even if a later gate step fails, so the Security tab
        # reflects the run. Non-fatal: repos without GitHub code-scanning/GHAS
        # enabled reject the upload, and that must not fail the security gate
        # (the fixable-CRITICAL/HIGH gate steps below are the real protection).
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Gate pass: fail the build only on CRITICAL/HIGH vulns that have a fix
      # available. ignore-unfixed keeps un-actionable noise from blocking PRs.
      - name: Trivy filesystem gate (fixable CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" fs \
              --scanners vuln \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --no-progress --exit-code 1 .

  image:
    name: Trivy — ${{ matrix.name }} image + SBOM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: services/api/Dockerfile
            tag: fuelgrid-api:scan
            sarif_category: trivy-image
            build_args: |
              VERSION=security-scan
              COMMIT=${{ github.sha }}
          - name: web
            file: apps/web/Dockerfile
            tag: fuelgrid-web:scan
            sarif_category: trivy-image-web
            build_args: ''
          - name: migrate
            file: services/api/Dockerfile.migrate
            tag: fuelgrid-migrate:scan
            sarif_category: trivy-image-migrate
            build_args: ''
          - name: caddy
            file: deploy/images/Dockerfile.caddy
            tag: fuelgrid-caddy:scan
            sarif_category: trivy-image-caddy
            build_args: ''
          - name: postgres
            file: deploy/images/Dockerfile.postgres
            tag: fuelgrid-postgres:scan
            sarif_category: trivy-image-postgres
            build_args: ''
          - name: redis
            file: deploy/images/Dockerfile.redis
            tag: fuelgrid-redis:scan
            sarif_category: trivy-image-redis
            build_args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=security-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.name }}
          build-args: ${{ matrix.build_args }}

      - name: Trivy image scan (SARIF report)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" image \
              --scanners vuln,secret \
              --format sarif --output "trivy-${{ matrix.name }}.sarif" \
              --no-progress --exit-code 0 "${{ matrix.tag }}"

      - name: Upload image SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: ${{ matrix.sarif_category }}

      - name: Trivy image gate (fixable CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --no-progress --exit-code 1 "${{ matrix.tag }}"

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" image \
              --format cyclonedx --output "fuelgrid-${{ matrix.name }}.cdx.json" \
              --no-progress "${{ matrix.tag }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-fuelgrid-${{ matrix.name }}-cyclonedx
          path: fuelgrid-${{ matrix.name }}.cdx.json
          if-no-files-found: error
