name: CD

# Continuous Deployment for FuelGrid OS (CICD-4 / OPS-5).
#
# The image builds + pushes to GHCR are always exercised (GHCR auth uses the
# automatic GITHUB_TOKEN). The droplet deploy runs on a dedicated self-hosted
# runner installed on the production droplet. The runner polls GitHub over
# outbound HTTPS, so port 22 can stay locked down to operator IPs instead of
# being opened to GitHub-hosted runner address ranges. The post-deploy smoke job
# still runs from GitHub-hosted infra and guards on DEPLOY_HEALTH_URL.
#
# Target: a single DigitalOcean Droplet running `docker compose` with
# self-hosted Postgres + Redis behind a Caddy reverse proxy. Migrations run ON
# THE DROPLET inside the deploy (a dedicated migrate image carries the SQL +
# golang-migrate) — NOT from this runner, because the self-hosted Postgres is
# not publicly reachable.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Single-flight per ref: never let two deploys of the same ref race. We do NOT
# cancel in progress — a half-applied migration interrupted mid-flight is worse
# than waiting for the prior deploy to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read
  # Required for docker/login-action to push to GHCR with GITHUB_TOKEN.
  packages: write

jobs:
  release-gate:
    name: Require CI, E2E, and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for required workflows on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['CI', 'E2E', 'Security Scan'];
            const current = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const earliest = Date.parse(current.data.created_at) - 60_000;
            const deadline = Date.now() + 22 * 60_000;

            while (Date.now() < deadline) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: context.sha,
                  event: 'push',
                  per_page: 100,
                },
              );

              const state = new Map();
              for (const workflow of required) {
                const matching = runs
                  .filter((run) => run.name === workflow && Date.parse(run.created_at) >= earliest)
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                state.set(workflow, matching[0]);
              }

              const failed = required
                .map((name) => [name, state.get(name)])
                .filter(([, run]) => run?.status === 'completed' && run.conclusion !== 'success');
              if (failed.length > 0) {
                for (const [name, run] of failed) {
                  core.error(`${name} concluded ${run.conclusion}: ${run.html_url}`);
                }
                core.setFailed('A required release workflow failed.');
                return;
              }

              const pending = required.filter((name) => state.get(name)?.conclusion !== 'success');
              if (pending.length === 0) {
                core.info('CI, E2E, and Security Scan all passed for this commit.');
                return;
              }

              core.info(`Waiting for: ${pending.join(', ')}`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed('Timed out waiting for required release workflows.');

  build-push:
    name: Build + push API image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR auth is automatic: GITHUB_TOKEN + packages:write is all that's
      # needed, no manually-created secret. Image repo is the lowercased
      # owner/repo with an -api suffix: ghcr.io/<owner>/<repo>-api.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      # Tags:
      #   - :sha-<full-sha>   immutable handle for every build
      #   - :latest           moving handle, only on branch pushes (not tags)
      #   - :<tag>            the git tag name, on tag pushes (e.g. v1.2.3)
      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

  build-push-web:
    name: Build + push Web image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    # Independent of the API build after the common release gate, so both tiers
    # build in parallel. Like build-push, this runs on every push to main / tag and uses
    # the automatic GITHUB_TOKEN for GHCR — no extra secret required.
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web image repo is the lowercased owner/repo with a -web suffix:
      # ghcr.io/<owner>/<repo>-web. The droplet's .env (WEB_IMAGE) is set by the
      # deploy job to this same ref + :sha-<full-sha> tag to roll it out.
      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      # Same tagging scheme as the API build so the rollout can pin :sha-<sha>:
      #   - :sha-<full-sha>   immutable handle for every build
      #   - :latest           moving handle, only on branch pushes (not tags)
      #   - :<tag>            the git tag name, on tag pushes (e.g. v1.2.3)
      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # Build context is the repo root (the web image needs the whole pnpm
      # workspace); the Dockerfile lives at apps/web/Dockerfile. Runtime config
      # (API_ORIGIN) is supplied by the compose `web` service at deploy time.
      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-migrate:
    name: Build + push migrate image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    # Independent of the app builds after the common release gate, so all three
    # tiers build in parallel. Carries golang-migrate + the SQL migrations baked in, so the
    # droplet (which has no repo checkout) can apply the schema as a one-shot.
    # Same automatic GITHUB_TOKEN GHCR auth — no extra secret.
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrate image repo is the lowercased owner/repo with a -migrate suffix:
      # ghcr.io/<owner>/<repo>-migrate. The deploy job sets MIGRATE_IMAGE to this
      # ref + :sha-<full-sha> and runs `docker compose run --rm migrate`.
      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-migrate"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # Build context is the repo root so services/api/migrations is reachable;
      # the Dockerfile.migrate copies them into a migrate/migrate base image.
      - name: Build + push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile.migrate
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-caddy:
    name: Build + push hardened Caddy image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image reference
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-caddy:hardened-v1" >> "$GITHUB_OUTPUT"
      - name: Build + push hardened Caddy image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/Dockerfile.caddy
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false
          cache-from: type=gha,scope=release-caddy
          cache-to: type=gha,mode=max,scope=release-caddy

  build-push-postgres:
    name: Build + push hardened Postgres image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image reference
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-postgres:16-hardened-v1" >> "$GITHUB_OUTPUT"
      - name: Build + push hardened Postgres image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false
          cache-from: type=gha,scope=release-postgres
          cache-to: type=gha,mode=max,scope=release-postgres

  deploy:
    name: Deploy on DigitalOcean droplet (self-hosted runner)
    runs-on: [self-hosted, Linux, X64, fuelgrid-prod]
    # Application and hardened infrastructure images must all be published
    # before the droplet can pull and validate the release.
    needs: [build-push, build-push-web, build-push-migrate, build-push-caddy, build-push-postgres]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install versioned deployment manifests
        run: |
          set -euo pipefail
          install -m 0644 deploy/docker-compose.prod.yml /opt/fuelgrid/docker-compose.prod.yml
          install -m 0644 deploy/Caddyfile /opt/fuelgrid/Caddyfile
          install -m 0755 deploy/backup/pg_backup.sh /opt/fuelgrid/pg_backup.sh
          cd /opt/fuelgrid
          docker compose --env-file .env -f docker-compose.prod.yml config >/dev/null

      - name: Capture current release
        id: previous
        run: |
          set -euo pipefail
          cd /opt/fuelgrid

          read_image() {
            sed -n "s/^$1=//p" .env | tail -n 1
          }

          previous_api=$(read_image API_IMAGE)
          previous_web=$(read_image WEB_IMAGE)
          previous_migrate=$(read_image MIGRATE_IMAGE)
          if [ -n "$previous_api" ] && [ -n "$previous_web" ] && [ -n "$previous_migrate" ]; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "api=$previous_api" >> "$GITHUB_OUTPUT"
            echo "web=$previous_web" >> "$GITHUB_OUTPUT"
            echo "migrate=$previous_migrate" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No complete prior image set exists; automatic application rollback is unavailable."
          fi

      - name: Create and verify mandatory offsite backup
        env:
          DEPLOY_DIR: /opt/fuelgrid
          COMPOSE_FILE: /opt/fuelgrid/docker-compose.prod.yml
          ENV_FILE: /opt/fuelgrid/.env
          REQUIRE_OFFSITE_BACKUP: '1'
        run: /opt/fuelgrid/pg_backup.sh

      # Run on the droplet itself. The runner user is `deploy`, owns
      # /opt/fuelgrid, and is in the docker group. Migrations are applied only
      # after the verified backup has been copied offsite.
      - name: Pull, migrate, and roll out
        id: rollout
        run: |
          set -euo pipefail
          cd /opt/fuelgrid

          owner_repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          api_image="ghcr.io/${owner_repo}-api:sha-${GITHUB_SHA}"
          web_image="ghcr.io/${owner_repo}-web:sha-${GITHUB_SHA}"
          migrate_image="ghcr.io/${owner_repo}-migrate:sha-${GITHUB_SHA}"
          caddy_image="${CADDY_IMAGE_WITH_DIGEST}"
          postgres_image="${POSTGRES_IMAGE_WITH_DIGEST}"

          # Authenticate to GHCR if a pull token was provided (private package).
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin
          fi

          # Pin the immutable image refs for this commit into the on-droplet
          # .env so `docker compose` interpolates them. Replace any prior lines.
          sed -i "\#^API_IMAGE=#d;\#^WEB_IMAGE=#d;\#^MIGRATE_IMAGE=#d;\#^CADDY_IMAGE=#d;\#^POSTGRES_IMAGE=#d" .env
          {
            echo "API_IMAGE=${api_image}"
            echo "WEB_IMAGE=${web_image}"
            echo "MIGRATE_IMAGE=${migrate_image}"
            echo "CADDY_IMAGE=${caddy_image}"
            echo "POSTGRES_IMAGE=${postgres_image}"
          } >> .env

          # Pull the freshly-built images.
          docker compose -f docker-compose.prod.yml pull api web migrate caddy postgres redis

          # Schema first: apply migrations as the OWNER (one-shot), then roll
          # out. golang-migrate `up` is idempotent (no pending = exit 0).
          docker compose -f docker-compose.prod.yml run --rm -T migrate

          # The hardened proxy runs as uid/gid 65534. Normalize persistent
          # Caddy volume ownership before the first transition from the
          # upstream root-running image (and harmlessly on later deploys).
          docker run --rm --user 0 --entrypoint /bin/sh \
            -v fuelgrid_prod_caddy_data:/data \
            -v fuelgrid_prod_caddy_config:/config \
            "${caddy_image}" \
            -c 'mkdir -p /data/caddy /config/caddy && chown -R 65534:65534 /data /config'

          # Roll out the app tiers + Caddy.
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_ACTOR: ${{ github.actor }}
          CADDY_IMAGE_WITH_DIGEST: ${{ needs.build-push-caddy.outputs.image }}@${{ needs.build-push-caddy.outputs.digest }}
          POSTGRES_IMAGE_WITH_DIGEST: ${{ needs.build-push-postgres.outputs.image }}@${{ needs.build-push-postgres.outputs.digest }}
          # Optional: a PAT with read:packages if the GHCR package is private.
          # Leave unset for a public package (compose pull needs no auth).
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Verify deployed release
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HEALTH_URL:-}" ]; then
            echo "::error::DEPLOY_HEALTH_URL is required for production deployment."
            exit 1
          fi

          status=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 10 "$DEPLOY_HEALTH_URL" || echo 000)
            if [ "$status" = "200" ] && grep -q '"status":"ready"' /tmp/readyz.json; then
              cat /tmp/readyz.json
              echo "Deployment readiness passed on attempt $i."
              exit 0
            fi
            echo "attempt $i: readiness status=$status; retrying in 5s"
            sleep 5
          done

          echo "::error::Deployment failed readiness verification."
          cat /tmp/readyz.json 2>/dev/null || true
          exit 1

      - name: Verify public web application
        run: |
          set -euo pipefail
          web_domain=$(sed -n 's/^WEB_DOMAIN=//p' /opt/fuelgrid/.env | tail -n 1)
          if [ -z "$web_domain" ]; then
            echo "::error::WEB_DOMAIN is missing from /opt/fuelgrid/.env."
            exit 1
          fi
          status=$(curl -sS -L -o /tmp/fuelgrid-login.html -w '%{http_code}' --max-time 20 "https://${web_domain}/login")
          if [ "$status" != "200" ]; then
            echo "::error::Web login page returned HTTP ${status}."
            exit 1
          fi
          grep -qi 'fuelgrid' /tmp/fuelgrid-login.html
          echo "Public web verification passed."

      - name: Roll back application images on failure
        if: failure() && steps.previous.outputs.captured == 'true'
        env:
          PREVIOUS_API_IMAGE: ${{ steps.previous.outputs.api }}
          PREVIOUS_WEB_IMAGE: ${{ steps.previous.outputs.web }}
          PREVIOUS_MIGRATE_IMAGE: ${{ steps.previous.outputs.migrate }}
        run: |
          set -euo pipefail
          cd /opt/fuelgrid
          sed -i '\#^API_IMAGE=#d;\#^WEB_IMAGE=#d;\#^MIGRATE_IMAGE=#d' .env
          {
            echo "API_IMAGE=${PREVIOUS_API_IMAGE}"
            echo "WEB_IMAGE=${PREVIOUS_WEB_IMAGE}"
            echo "MIGRATE_IMAGE=${PREVIOUS_MIGRATE_IMAGE}"
          } >> .env
          docker compose -f docker-compose.prod.yml pull api web
          docker compose -f docker-compose.prod.yml up -d --no-deps api web caddy
          docker compose -f docker-compose.prod.yml ps
          echo "::warning::Application images were rolled back. The verified pre-migration backup was retained for database recovery if required."

  smoke:
    name: Post-deploy smoke (/readyz must be 200)
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Probe deployed /readyz from GitHub-hosted infrastructure
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HEALTH_URL:-}" ]; then
            echo "::error::DEPLOY_HEALTH_URL is required."
            exit 1
          fi
          echo "Probing $DEPLOY_HEALTH_URL"
          status=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 10 "$DEPLOY_HEALTH_URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "readyz returned 200 on attempt $i"
              cat /tmp/readyz.json
              break
            fi
            echo "attempt $i: status=$status, retrying in 5s..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy smoke gate failed: /readyz returned $status (expected 200)"
            cat /tmp/readyz.json 2>/dev/null || true
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/readyz.json
          echo "Post-deploy smoke gate passed."
