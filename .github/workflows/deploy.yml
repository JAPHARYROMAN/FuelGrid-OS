name: CD

# Continuous Deployment for FuelGrid OS (CICD-4 / OPS-5).
#
# The image builds + pushes to GHCR are always exercised (GHCR auth uses the
# automatic GITHUB_TOKEN). The droplet deploy runs on a dedicated self-hosted
# runner installed on the production droplet. The runner polls GitHub over
# outbound HTTPS, so port 22 can stay locked down to operator IPs instead of
# being opened to GitHub-hosted runner address ranges. The post-deploy smoke job
# still runs from GitHub-hosted infra and guards on DEPLOY_HEALTH_URL.
#
# Target: a single DigitalOcean Droplet running `docker compose` with
# self-hosted Postgres + Redis behind a Caddy reverse proxy. Migrations run ON
# THE DROPLET inside the deploy (a dedicated migrate image carries the SQL +
# golang-migrate) — NOT from this runner, because the self-hosted Postgres is
# not publicly reachable.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Single-flight per ref: never let two deploys of the same ref race. We do NOT
# cancel in progress — a half-applied migration interrupted mid-flight is worse
# than waiting for the prior deploy to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for docker/login-action to push to GHCR with GITHUB_TOKEN.
  packages: write

jobs:
  build-push:
    name: Build + push API image to GHCR
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR auth is automatic: GITHUB_TOKEN + packages:write is all that's
      # needed, no manually-created secret. Image repo is the lowercased
      # owner/repo with an -api suffix: ghcr.io/<owner>/<repo>-api.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      # Tags:
      #   - :sha-<full-sha>   immutable handle for every build
      #   - :latest           moving handle, only on branch pushes (not tags)
      #   - :<tag>            the git tag name, on tag pushes (e.g. v1.2.3)
      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}

  build-push-web:
    name: Build + push Web image to GHCR
    runs-on: ubuntu-latest
    environment: production
    # Independent of the API build (no `needs:`) so both tiers build in
    # parallel. Like build-push, this runs on every push to main / tag and uses
    # the automatic GITHUB_TOKEN for GHCR — no extra secret required.
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web image repo is the lowercased owner/repo with a -web suffix:
      # ghcr.io/<owner>/<repo>-web. The droplet's .env (WEB_IMAGE) is set by the
      # deploy job to this same ref + :sha-<full-sha> tag to roll it out.
      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      # Same tagging scheme as the API build so the rollout can pin :sha-<sha>:
      #   - :sha-<full-sha>   immutable handle for every build
      #   - :latest           moving handle, only on branch pushes (not tags)
      #   - :<tag>            the git tag name, on tag pushes (e.g. v1.2.3)
      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # Build context is the repo root (the web image needs the whole pnpm
      # workspace); the Dockerfile lives at apps/web/Dockerfile. Runtime config
      # (API_ORIGIN) is supplied by the compose `web` service at deploy time.
      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-migrate:
    name: Build + push migrate image to GHCR
    runs-on: ubuntu-latest
    environment: production
    # Independent of the app builds (no `needs:`) so all three tiers build in
    # parallel. Carries golang-migrate + the SQL migrations baked in, so the
    # droplet (which has no repo checkout) can apply the schema as a one-shot.
    # Same automatic GITHUB_TOKEN GHCR auth — no extra secret.
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrate image repo is the lowercased owner/repo with a -migrate suffix:
      # ghcr.io/<owner>/<repo>-migrate. The deploy job sets MIGRATE_IMAGE to this
      # ref + :sha-<full-sha> and runs `docker compose run --rm migrate`.
      - name: Compute image reference
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-migrate"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image repository: $image"

      - name: Docker metadata (tags + labels)
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # Build context is the repo root so services/api/migrations is reachable;
      # the Dockerfile.migrate copies them into a migrate/migrate base image.
      - name: Build + push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile.migrate
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on DigitalOcean droplet (self-hosted runner)
    runs-on: [self-hosted, Linux, X64, fuelgrid-prod]
    # All three images must be published before the droplet pulls them: migrate
    # for the one-shot, api/web for `up -d`.
    needs: [build-push, build-push-web, build-push-migrate]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out deployment definition
        uses: actions/checkout@v4

      # Run on the droplet itself. The runner user is `deploy`, owns
      # /opt/fuelgrid, and is in the docker group. ITEMBA-R owns Caddy and the
      # public ports; this job installs only the shared-droplet FuelGrid stack.
      - name: Deploy local docker compose stack
        run: |
          set -euo pipefail
          install -m 0644 deploy/docker-compose.shared-droplet.yml \
            /opt/fuelgrid/docker-compose.shared-droplet.yml
          install -m 0755 deploy/backup/pg_backup.sh \
            /opt/fuelgrid/pg_backup.sh
          cd /opt/fuelgrid
          compose_file=docker-compose.shared-droplet.yml

          owner_repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          api_image="ghcr.io/${owner_repo}-api:sha-${GITHUB_SHA}"
          web_image="ghcr.io/${owner_repo}-web:sha-${GITHUB_SHA}"
          migrate_image="ghcr.io/${owner_repo}-migrate:sha-${GITHUB_SHA}"

          # Authenticate to GHCR if a pull token was provided (private package).
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin
          fi

          # Pin the immutable image refs for this commit into the on-droplet
          # .env so `docker compose` interpolates them. Replace any prior lines.
          sed -i "\#^API_IMAGE=#d;\#^WEB_IMAGE=#d;\#^MIGRATE_IMAGE=#d" .env
          {
            echo "API_IMAGE=${api_image}"
            echo "WEB_IMAGE=${web_image}"
            echo "MIGRATE_IMAGE=${migrate_image}"
          } >> .env

          # ITEMBA-R's Caddy and FuelGrid's public services meet only on this
          # explicitly named network. Creating it is idempotent and does not
          # restart either application.
          shared_edge=$(sed -n 's/^SHARED_EDGE_NETWORK=//p' .env | tail -n1)
          shared_edge=${shared_edge:-itemba_shared_edge}
          docker network inspect "${shared_edge}" >/dev/null 2>&1 \
            || docker network create "${shared_edge}"

          docker compose -f "${compose_file}" config >/dev/null

          # Never let a routine deployment silently replace a missing database
          # volume with an empty one. A first installation requires a temporary,
          # explicit opt-in in /opt/fuelgrid/.env.
          allow_bootstrap=$(sed -n 's/^ALLOW_INITIAL_DATABASE_BOOTSTRAP=//p' .env | tail -n1)
          allow_bootstrap=${allow_bootstrap:-false}
          if ! docker volume inspect fuelgrid_prod_pgdata >/dev/null 2>&1 \
            && [ "${allow_bootstrap}" != "true" ]; then
            echo "ERROR: FuelGrid production database volume is missing." >&2
            echo "Set ALLOW_INITIAL_DATABASE_BOOTSTRAP=true only for the first installation." >&2
            exit 1
          fi

          # Pull the freshly-built images.
          docker compose -f "${compose_file}" pull api web migrate

          # Start the private data services, then protect the current state with
          # a verified logical backup before applying any migration.
          docker compose -f "${compose_file}" up -d postgres redis
          has_schema=$(docker compose -f "${compose_file}" exec -T postgres \
            sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT to_regclass('\''public.schema_migrations'\'') IS NOT NULL"' \
            | tr -d '[:space:]')
          if [ "${has_schema}" = "t" ]; then
            DEPLOY_DIR=/opt/fuelgrid \
              COMPOSE_FILE=/opt/fuelgrid/docker-compose.shared-droplet.yml \
              ENV_FILE=/opt/fuelgrid/.env \
              BACKUP_DIR=/var/backups/fuelgrid \
              /opt/fuelgrid/pg_backup.sh
          elif [ "${allow_bootstrap}" != "true" ]; then
            echo "ERROR: FuelGrid database has no migration history." >&2
            echo "Refusing to migrate a potentially wrong or empty volume." >&2
            exit 1
          else
            echo "Authorized first installation: no existing database to back up."
          fi

          # Schema first: apply migrations as the OWNER (one-shot), then roll
          # out. golang-migrate `up` is idempotent (no pending = exit 0).
          docker compose -f "${compose_file}" run --rm -T migrate
          docker compose -f "${compose_file}" run --rm -T db-role-sync

          # Roll out only FuelGrid's private app and data tiers. --remove-orphans
          # removes the obsolete FuelGrid-owned Caddy if this host previously
          # used the standalone compose definition.
          docker compose -f "${compose_file}" up -d --remove-orphans postgres redis api web

          # Bootstrap authorization is one-use. Persist the safe default after
          # the first successful rollout so later volume loss stops deployment.
          if [ "${allow_bootstrap}" = "true" ]; then
            sed -i 's/^ALLOW_INITIAL_DATABASE_BOOTSTRAP=.*/ALLOW_INITIAL_DATABASE_BOOTSTRAP=false/' .env
          fi

          # Reclaim disk from superseded image layers and print the final state.
          docker image prune -f
          docker compose -f "${compose_file}" ps
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_ACTOR: ${{ github.actor }}
          # Optional: a PAT with read:packages if the GHCR package is private.
          # Leave unset for a public package (compose pull needs no auth).
          # The job token can pull packages built by this same workflow. A
          # dedicated PAT remains an optional override for stricter setups.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}

  smoke:
    name: Post-deploy smoke (/readyz must be 200)
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      # Guard on DEPLOY_HEALTH_URL the same way as the deploy gate: skip cleanly
      # when the health URL secret is unset.
      - name: Check for DEPLOY_HEALTH_URL secret
        id: gate
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -n "$DEPLOY_HEALTH_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HEALTH_URL is configured — smoke gate will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HEALTH_URL secret is not set; skipping smoke gate (no-op until infra exists)."
          fi

      # Poll /readyz: the deployed API reports 200 + {"status":"ready"} only
      # when its postgres and redis checks pass. Anything else fails the deploy.
      - name: Probe deployed /readyz
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          echo "Probing $DEPLOY_HEALTH_URL"
          status=0
          for i in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' --max-time 10 "$DEPLOY_HEALTH_URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "readyz returned 200 on attempt $i"
              cat /tmp/readyz.json
              break
            fi
            echo "attempt $i: status=$status, retrying in 5s..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy smoke gate failed: /readyz returned $status (expected 200)"
            cat /tmp/readyz.json 2>/dev/null || true
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/readyz.json
          echo "Post-deploy smoke gate passed."
